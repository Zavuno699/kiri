version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kirilock-postgres-dev
    environment:
      POSTGRES_DB: kirilock
      POSTGRES_USER: kirilock
      POSTGRES_PASSWORD: kirilock_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kirilock -d kirilock"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
